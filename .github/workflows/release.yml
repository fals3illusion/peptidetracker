name: Tests and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: America/Chicago
          PG_TEST_URL: postgres://postgres:test@localhost:5432/postgres
      - name: Check shell scripts
        run: bash -n ct/peptidetracker.sh install/peptidetracker-install.sh scripts/*.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Version matches tag
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build release bundle (app + production dependencies)
        run: |
          npm ci --omit=dev
          tar -czf peptidetracker.tar.gz package.json package-lock.json server.js set-password.js \
            lib public scripts grafana node_modules CHANGELOG.md LICENSE README.md
          sha256sum peptidetracker.tar.gz | awk '{print $1}' > peptidetracker.tar.gz.sha256
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-publishing the same version (scripts/release.sh X.Y.Z --replace) replaces its release.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" peptidetracker.tar.gz peptidetracker.tar.gz.sha256 --title "PeptideTracker $GITHUB_REF_NAME" --notes-file notes.md --latest
