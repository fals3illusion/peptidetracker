name: Feature idea
description: Suggest something new or better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea and the problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How do you track this today? (optional)
